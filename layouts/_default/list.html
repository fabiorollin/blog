{{ define "main" }}
<section class="hero">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="hero-sub">{{ . }}</p>{{ end }}
</section>

<section class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    <article class="post-row">
      <div class="post-date">{{ .Date.Format "Jan 2, 2006" }}</div>
      <div class="post-meta">
        <h2 class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ if .Description }}<p class="post-summary">{{ .Description }}</p>{{ end }}
      </div>
    </article>
  {{ end }}
</section>
{{ end }}
