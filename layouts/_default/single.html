{{ define "main" }}
<article class="post">
  <header class="post-header">
    <div class="post-date">{{ .Date.Format "January 2, 2006" }} · {{ math.Round (div (countwords .Content) 200.0) }} min read</div>
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if .Description }}<p class="post-lede">{{ .Description }}</p>{{ end }}
    <div class="post-tags">
      {{ range .Params.tags }}
        <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  <footer class="post-footer">
    <a href="/" class="back-link">← Back to all posts</a>
  </footer>
</article>
{{ end }}
